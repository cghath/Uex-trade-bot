name: Tests

on:
  push:
    branches: [main, TestBranch]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt ruff
      - name: Lint (undefined names / unused imports only)
        run: python -m ruff check --select F bot/ tests/
      - name: Run tests
        run: python -m pytest -q
